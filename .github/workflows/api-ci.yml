name: API CI

on:
  workflow_call:
    inputs: 
      skip:
        type: boolean
        default: false
      event_name:
        type: string
        required: false
      # Full unit/integration suites. False on merge_group (build gate only) and
      # on push to main (merge queue already validated; proceed to deploy).
      run_tests:
        type: boolean
        default: true

permissions:
  contents: "read"
  id-token: "write"
  issues: "write"
  pull-requests: "write"

jobs:
  # TODO: Enable after we actually get this passing. It's just noise until then.
  # api-mypy:
  #   name: Patch typing (API)
  #   if: ${{ inputs.skip == false }}
  #   uses: codecov/gha-workflows/.github/workflows/mypy.yml@v1.2.31
  #   with:
  #     working_directory: apps/codecov-api

  api-build:
    name: Build App (API)
    if: ${{ inputs.skip == false }}
    uses: ./.github/workflows/_build-app.yml
    secrets: inherit
    with:
      repo: ${{ vars.CODECOV_API_IMAGE_V2 || vars.CODECOV_API_IMAGE_V2_SELF_HOSTED || 'codecov/self-hosted-api' }}
      output_directory: apps/codecov-api
      make_target_prefix: api.

  api-test:
    name: Test (API)
    if: ${{ inputs.skip == false && inputs.run_tests == true }}
    needs: [api-build]
    uses: ./.github/workflows/_run-tests.yml
    secrets: inherit
    with:
      run_integration: false
      repo: ${{ vars.CODECOV_API_IMAGE_V2 || vars.CODECOV_API_IMAGE_V2_SELF_HOSTED || 'codecov/self-hosted-api' }}
      output_directory: apps/codecov-api
      flag_prefix: api
      pytest_rootdir: /app
      make_target_prefix: api.

  api-build-self-hosted:
    name: Build Self Hosted (API)
    # Skip on merge_group: not needed for the merge gate. On push to main,
    # api-test is skipped so allow the job to proceed when tests are skipped.
    if: ${{ inputs.skip == false && inputs.event_name != 'merge_group' && needs.api-build.result == 'success' && (needs.api-test.result == 'success' || needs.api-test.result == 'skipped') }}
    needs: [api-build, api-test]
    uses: ./.github/workflows/_self-hosted.yml
    secrets: inherit
    with:
      repo: ${{ vars.CODECOV_API_IMAGE_V2 || vars.CODECOV_API_IMAGE_V2_SELF_HOSTED || 'codecov/self-hosted-api' }}
      output_directory: apps/codecov-api
      make_target_prefix: api.

  api-production:
    name: Push Production Image (API)
    needs: [api-build, api-test]
    if: ${{ inputs.skip == false && github.event_name == 'push' && github.event.ref == 'refs/heads/main' && github.repository_owner == 'codecov' && needs.api-build.result == 'success' && (needs.api-test.result == 'success' || needs.api-test.result == 'skipped') }}
    uses: ./.github/workflows/_push-env.yml
    secrets: inherit
    with:
      environment: production
      repo: ${{ vars.CODECOV_API_IMAGE_V2 || vars.CODECOV_API_IMAGE_V2_SELF_HOSTED || 'codecov/self-hosted-api' }}
      output_directory: apps/codecov-api
      sentry_project: api
      make_target_prefix: api.

  api-self-hosted:
    name: Push Self Hosted Image (API)
    needs: [api-build-self-hosted, api-test]
    secrets: inherit
    if: ${{ inputs.skip == false && github.event_name == 'push' && github.event.ref == 'refs/heads/main' && github.repository_owner == 'codecov' && needs.api-build-self-hosted.result == 'success' && (needs.api-test.result == 'success' || needs.api-test.result == 'skipped') }}
    uses: ./.github/workflows/_self-hosted.yml
    with:
      push_rolling: true
      repo: ${{ vars.CODECOV_API_IMAGE_V2 || vars.CODECOV_API_IMAGE_V2_SELF_HOSTED || 'codecov/self-hosted-api' }}
      output_directory: apps/codecov-api
      make_target_prefix: api.

  # This job works around a strange interaction between reusable workflows and
  # path filters.
  #
  # When a job that uses a reusable workflow is skipped, a single check shows up
  # for it (e.g. `API CI / Test`). If the job is _not_ skipped, that check does
  # not appear and instead you see checks for all of the jobs nested in the
  # reusable workflow (`API CI / Test / Run tests`). There's no single check
  # that's consistently there which you can mark as required.
  #
  # Because this job does not use a reusable workflow, it will produce the same
  # check whether or not it is skipped. So, we can make this check required and
  # have it figure out whether the jobs we actually care about failed.
  #
  # On pull_request / staging: requires tests. On merge_group / push to main:
  # tests are skipped and the build is the gate.
  api-required-checks:
    name: Required checks (API)
    # Reference needs.*.result so this still runs when api-test is skipped
    # (merge_group / push to main).
    if: ${{ !cancelled() && inputs.skip == false && needs.api-build.result != 'skipped' && (needs.api-test.result == 'success' || needs.api-test.result == 'skipped' || needs.api-test.result == 'failure') }}
    runs-on: ubuntu-latest
    needs: [api-build, api-test]
    steps:
      - name: Fail build
        if: ${{ needs.api-build.result == 'failure' || needs.api-build.result == 'cancelled' }}
        run: exit 1
      - name: Fail tests
        if: ${{ needs.api-test.result == 'failure' }}
        run: exit 1

  trigger-api-deploy:
    name: Trigger codecov-api deployment
    needs: [api-required-checks, api-production]
    if: ${{ !cancelled() && inputs.event_name == 'push' && inputs.skip == false && needs.api-required-checks.result == 'success' && needs.api-production.result == 'success' }}
    uses: ./.github/workflows/trigger-api-deploy.yml
