union BundleAnalysisComparisonResult =
    BundleAnalysisComparison
  | FirstPullRequest
  | MissingBaseCommit
  | MissingHeadCommit
  | MissingHeadReport
  | MissingBaseReport

type BundleAnalysisComparison {
  bundles: [BundleComparison]!
  bundleData: BundleData!
  bundleChange: BundleData!
  sizeDelta: Int!
  loadTimeDelta: Int!
}

type BundleComparison {
  name: String!
  changeType: String!
  bundleData: BundleData!
  bundleChange: BundleData!
  sizeDelta: Int!
  sizeTotal: Int!
  loadTimeDelta: Int!
  loadTimeTotal: Int!
}