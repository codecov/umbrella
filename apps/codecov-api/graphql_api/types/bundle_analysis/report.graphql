union BundleAnalysisReportResult =
    BundleAnalysisReport
  | MissingHeadReport

type BundleAnalysisReport {
  bundles: [BundleReport]!
  bundleData: BundleData!
  bundle(name: String!, filters: BundleAnalysisReportFilters): BundleReport
  isCached: Boolean!
  loadTimeTotal: Float! @deprecated(reason: "Use bundleData { loadTime { threeG } } instead")
  total_load_time: Float! @deprecated(reason: "Use bundleData { loadTime { threeG } } instead")
}
