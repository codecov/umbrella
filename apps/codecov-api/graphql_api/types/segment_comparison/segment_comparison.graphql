type SegmentComparison {
  header: String!
  hasUnintendedChanges: Boolean!
  lines: [LineComparison!]!
}

type SegmentComparisons {
  results: [SegmentComparison!]!
}

# Deprecated: use SegmentComparisons instead
type Segments {
  results: [SegmentComparison!]!
}

union SegmentsResult = SegmentComparisons | Segments | UnknownPath | ProviderError
