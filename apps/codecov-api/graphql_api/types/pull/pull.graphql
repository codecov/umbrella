type Pull {
  behindBy: Int
  behindByCommit: String
  title: String
  state: PullRequestState!
  pullId: Int!
  author: Owner
  updatestamp: DateTime
  head: Commit
  comparedTo: Commit
  pullBase: Commit @deprecated(reason: "Use comparedTo")
  compareWithBase: ComparisonResult
  bundleAnalysisCompareWithBase: BundleAnalysisComparisonResult
  commits(
    first: Int
    after: String
    last: Int
    before: String
  ): CommitConnection @cost(complexity: 10, multipliers: ["first", "last"])
  firstPull: Boolean!
}
