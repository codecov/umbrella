services:
  repo:
    image: ${AR_REPO}:test-${VERSION}
    tty: true
    depends_on:
      - minio
      - postgres
      - redis
      - timescale
    volumes:
      - ./:/app
      - ./tools/devenv/config/test.yml:/config/codecov.yml
    networks:
      - codecov
    environment:
      # Note: COVERAGE_CORE=sysmon removed due to Python 3.13 incompatibility with branch coverage
      # https://github.com/nedbat/coveragepy/issues/1665#issuecomment-1937075835
      - RUN_ENV=DEV
      - CODECOV_YML=/config/codecov.yml
    env_file:
      - .testenv
    entrypoint:
      - /bin/sh # We don't really need to start the service for tests

  postgres:
    image: postgres:14-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PASSWORD=password
    volumes:
      - type: tmpfs
        target: /var/lib/postgresql/data
        tmpfs:
          size: 1024M
    networks:
      - codecov

  timescale:
    image: timescale/timescaledb:latest-pg14
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_PASSWORD=password
    volumes:
      - ./docker/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    networks:
      - codecov

  redis:
    image: redis:6-alpine
    networks:
      - codecov

  minio:
    # Official minio/minio was removed from Docker Hub; quay.io/minio/minio has
    # since disabled anonymous pulls ($disabled). bitnamilegacy still serves
    # the last public Bitnami builds.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      - MINIO_ROOT_USER=codecov-default-key
      - MINIO_ROOT_PASSWORD=codecov-default-secret
      - MINIO_API_PORT_NUMBER=9002
      - MINIO_CONSOLE_PORT_NUMBER=9003
    volumes:
      - type: tmpfs
        target: /bitnami/minio/data
        tmpfs:
          size: 256M
    networks:
      - codecov

  mailhog:
    image: mailhog/mailhog:latest
    networks:
      - codecov

networks:
  codecov:
    driver: bridge
